<div
  class="min-h-screen flex items-center justify-center bg-gradient-to-br from-blue-50 to-indigo-100 px-4"
>
  <div class="w-full max-w-md bg-white rounded-2xl shadow-lg p-8">
    <div class="text-center mb-8">
      <h1 class="text-2xl font-bold text-gray-800">Employee Management</h1>
      <p class="text-gray-500 mt-1">Sign in to your account</p>
    </div>
    <form (ngSubmit)="onSubmit()" #loginForm="ngForm">
      <div
        *ngIf="error"
        class="mb-4 p-3 bg-red-50 border border-red-200 text-red-700 rounded-lg text-sm"
      >
        Invalid username or password
      </div>
      <div class="mb-4">
        <label
          for="username"
          class="block text-sm font-medium text-gray-700 mb-1"
          >Username</label
        >
        <input
          id="username"
          name="username"
          type="text"
          required
          [(ngModel)]="username"
          class="w-full px-4 py-2.5 border border-gray-300 rounded-lg focus:ring-2 focus:ring-indigo-500 focus:border-indigo-500 outline-none transition"
          placeholder="Enter username"
        />
      </div>
      <div class="mb-6">
        <label
          for="password"
          class="block text-sm font-medium text-gray-700 mb-1"
          >Password</label
        >
        <input
          id="password"
          name="password"
          type="password"
          required
          [(ngModel)]="password"
          class="w-full px-4 py-2.5 border border-gray-300 rounded-lg focus:ring-2 focus:ring-indigo-500 focus:border-indigo-500 outline-none transition"
          placeholder="Enter password"
        />
      </div>
      <button
        type="submit"
        class="w-full bg-indigo-600 text-white py-2.5 rounded-lg font-semibold hover:bg-indigo-700 transition focus:outline-none focus:ring-2 focus:ring-indigo-500 focus:ring-offset-2"
      >
        Sign In
      </button>
    </form>
  </div>
</div>
